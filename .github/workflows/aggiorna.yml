name: Aggiorna feed

on:
  schedule:
    - cron: "17 * * * *"   # ogni ora, al minuto 17
  workflow_dispatch:        # permette di avviarlo a mano
  push:
    paths: ["feeds.txt", "genera.py"]

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser
      - run: python genera.py
      - name: Salva la pagina aggiornata
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Aggiorna feed"
          git push
